name: Release plugin

# A release is created automatically when main gets a plugin version that has
# no release yet (version taken from the plugin header). The zip asset name
# matches what the plugin's GitHub updater looks for: text-to-image-api-*.zip
on:
  push:
    branches: [main]
    paths:
      - 'text-to-image-api/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          VERSION=$(sed -n 's/^ \* Version: *//p' text-to-image-api/text-to-image-api.php | head -1 | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build zip and create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION exists"; exit 0; fi
          zip -r "text-to-image-api-$VERSION.zip" text-to-image-api
          gh release create "v$VERSION" "text-to-image-api-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Text to Image API $VERSION" \
            --notes "Black-and-white cards as 3-level gray PNG (~4.7x smaller), no resized copies, cleanup of older cards. See readme.txt changelog." \
            --latest
